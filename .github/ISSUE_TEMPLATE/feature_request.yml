name: Feature request
description: Propose a bounded product or developer improvement
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Operator problem
      description: Describe the job without private customer or relationship data.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: dropdown
    id: data
    attributes:
      label: Does this expand data collection or disclosure?
      options: [No, Yes, Unsure]
    validations:
      required: true
  - type: dropdown
    id: sideeffects
    attributes:
      label: Does this add network access, outreach, or CRM mutation?
      options: [No, Yes, Unsure]
    validations:
      required: true
  - type: textarea
    id: safety
    attributes:
      label: Consent, privacy, and threat-model impact
      description: Explain how hard gates and safe exports remain intact.
    validations:
      required: true
  - type: checkboxes
    id: boundaries
    attributes:
      label: Project boundaries
      options:
        - label: I understand scraping, private APIs, guessed URLs, autonomous outreach, and CRM writes are non-goals.
          required: true
        - label: I have not included real contacts, target lists, credentials, or relationship data.
          required: true
